<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SID – Project Calendar</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f2;--surf:#fff;--side:#fbfcf8;--ink:#2b2d2f;--ink2:#6f7580;--line:#e4e8dc;--g:#7cb518;--gd:#4f7d0c;--gt:#eef6d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--surf);color:var(--ink);font:500 14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.dtv,.dte{display:inline-flex;align-items:center;gap:6px}.dte .in{padding:5px 8px;font-size:12px;width:auto}
.ib.sm.ed{width:26px;height:26px;border-radius:8px;color:var(--ink2)}.ib.sm.ed:hover{color:var(--gd);background:var(--gt)}.ib.sm.ok{background:var(--gd);color:#fff;border-color:var(--gd)}
.logo a{display:inline-block;border-radius:8px}a.mlogo{display:none;border-radius:8px}.logo img{height:38px;display:block}
nav{display:flex;flex-direction:column;gap:6px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600}
nav a svg{width:18px;height:18px;flex:none}
nav a:hover{color:var(--ink)}
nav a[aria-current=page]{color:var(--gd);background:var(--gt)}
.create{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:var(--gt);border-radius:16px;padding:18px 16px;font-weight:700;line-height:1.25;color:var(--gd)}
.create b{width:38px;height:38px;border-radius:50%;background:var(--gd);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none}
.cloud{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.cloud i{width:9px;height:9px;border-radius:50%;background:#c3c8bc}
.cloud.on i{background:var(--g);box-shadow:0 0 0 3px var(--gt)}
main{padding:22px 28px 28px;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:auto;background:var(--surf)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.ws{display:flex;align-items:center;gap:10px;font-weight:700}
.ws .nm{height:34px;padding:0 16px;border-radius:17px;background:var(--gd);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.ws .lo{height:34px;padding:0 16px;border-radius:17px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.ws .lo:hover{border-color:var(--g);color:var(--gd)}
.ctl{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ctl h2{margin:0 8px 0 0;font-size:18px;min-width:150px}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:18px;line-height:1}
.pill{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 16px;font-weight:600}
.ib:hover,.pill:hover{border-color:var(--g)}
.cal{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px}
.dow,.wk{display:grid;grid-template-columns:repeat(var(--cols,7),1fr)}
.dow div{padding:10px 8px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--side);border-left:1px solid var(--line)}
.dow div:first-child,.cell:first-child{border-left:0}
.weeks{flex:1;display:flex;flex-direction:column}
.wk{position:relative;flex:1 0 auto;border-top:1px solid var(--line)}
.cell{border-left:1px solid var(--line);padding:6px 8px;font-size:12px;color:var(--ink);cursor:pointer;min-width:0}
.cell:hover{background:#fafcf5}
.cell.o{color:#a4a99d;background:#fcfdfa}
.cell em{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;padding:0 4px;font-weight:600}
.cell.t em{background:var(--gd);color:#fff}
.ev{position:absolute;inset:34px 0 auto 0;display:grid;grid-template-columns:repeat(var(--cols,7),1fr);grid-auto-rows:26px;row-gap:4px;pointer-events:none}
.bar{pointer-events:auto;margin:0 3px;border:0;padding:0 12px;font-size:12px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bar small{font-weight:500;opacity:.8;margin-left:6px}
.bar:hover{filter:brightness(.95)}
.empty{color:var(--ink2);text-align:center;padding:40px 0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pitem{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:16px;border-top:4px solid var(--c,var(--g));transition:box-shadow .15s,transform .15s}
.pitem:hover{border-color:var(--c,var(--g));box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
.pitem .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pitem .n{min-width:0;font-size:15px;overflow-wrap:anywhere}.pitem small{color:var(--ink2);font-size:12px}
.pitem .pf{display:flex;align-items:center;gap:10px;margin-top:auto}.pitem .pf .pbar{flex:1}
.ttag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--gt);color:var(--gd);margin-bottom:6px}.ttag.m{background:#e8eefc;color:#2f55b8}
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsel button{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:10px;text-align:left;font-size:13px;font-weight:700}
.tsel button small{display:block;font-weight:500;color:var(--ink2);margin-top:2px;font-size:11px}
.tsel button[aria-pressed=true]{border-color:var(--g);background:var(--gt)}
.fgrid{display:grid;gap:14px;max-width:460px}
label{display:grid;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.in{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 12px;width:100%}
.in:focus{border-color:#7a808a}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.btn{border:0;background:var(--gd);color:#fff;border-radius:12px;padding:11px 20px;font-weight:700}
.btn.sec{background:var(--gt);color:var(--gd)}
.btn.del{background:none;color:#b3402a;margin-right:auto;padding-left:0}
dialog{border:0;border-radius:20px;padding:24px;width:min(440px,calc(100vw - 32px));background:var(--surf);color:var(--ink);box-shadow:0 30px 80px rgba(20,40,10,.3)}
dialog::backdrop{background:rgba(20,40,10,.4)}
dialog h2{margin:0 0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;align-items:center}
.err{color:#b3402a;font-size:12px;min-height:16px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.dow .sun{color:#dc2626}.dow .sat{color:#2563eb}
.cell.sun em{color:#dc2626}.cell.sat em{color:#2563eb}.cell.o em{opacity:.55}.cell.t.sun em,.cell.t.sat em{color:#fff}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--ink)}
.gantt{overflow:auto;flex:1;min-height:320px;border:1px solid var(--line);border-radius:14px;background:var(--surf);scrollbar-width:thin}
.gr{display:flex;min-width:max-content}
.gname{position:sticky;left:0;z-index:3;width:210px;flex:none;background:var(--surf);padding:6px 12px 6px 10px}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;height:44px;background:var(--surf);width:100%;text-align:left}
.who:hover{border-color:var(--g)}
.who .dot{width:10px;height:26px;border-radius:5px;flex:none}
.who div{min-width:0;line-height:1.25}.who strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}.who small{color:var(--ink2);font-size:10px;white-space:nowrap}
.tl{position:relative;flex:none;height:56px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--cw) 100%}
.gh{position:sticky;top:0;z-index:4;background:var(--surf)}
.gh .gname{padding:10px}
.gh .tl{height:48px;background:none;display:flex}
.d{width:var(--cw);flex:none;display:grid;place-items:center;font-size:12px;color:var(--ink2)}
.d span{padding:3px 8px;border-radius:8px;white-space:nowrap}
.d.sun{color:#dc2626}.d.sat{color:#2563eb}
.d.today span{background:var(--gd);color:#fff;font-weight:700}
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--gd);z-index:1}
.tbar{position:absolute;top:9px;height:38px;border:0;border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;z-index:2}
.bar.thin{position:relative;background:transparent!important;border-radius:0!important;padding:0 2px;font-size:10px;line-height:18px;font-weight:700;opacity:.95}.bar.thin:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:6px;border-radius:var(--rl,0) var(--rr,0) var(--rr,0) var(--rl,0);background:var(--bc)}
.tbar.thin{top:21px;height:9px;padding:0;border-radius:5px}.tbar.thin i,.tbar.thin span{display:none}
.tbar i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;flex:none}
.tbar i:after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tbar:hover{filter:brightness(.95)}
.pc{position:absolute;top:19px;font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surf);padding:8px 14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--gt);color:var(--gd)}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surf)}
.card h3{margin:0;font-size:15px}
.dgrid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:stretch}
.dday{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 0 4px;padding:14px 16px;border-radius:14px;background:var(--gt);color:var(--gd)}
.dday small{width:100%;font-size:11px;font-weight:600;opacity:.85}.dday strong{font-size:40px;line-height:1;letter-spacing:-.02em;font-weight:800}.dday span{font-size:12px;opacity:.85}
.dday.soon{background:#fff1e0;color:#c2570c}.dday.late{background:#fde8e4;color:#b3402a}
.ddb{font-weight:800;font-size:13px;padding:4px 12px;border-radius:12px;background:var(--gt);color:var(--gd);flex:none}.ddb.soon{background:#fff1e0;color:#c2570c}.ddb.late{background:#fde8e4;color:#b3402a}
.kk{margin-left:10px;border:0;border-radius:10px;background:#fee500;color:#181600;font-size:11px;font-weight:700;padding:4px 10px;vertical-align:middle}.kk:disabled{opacity:.5}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}.mseg button{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:12px 4px;font-weight:700;font-size:13px;color:var(--ink2)}.mseg button[aria-pressed=true]{border-color:var(--g);background:var(--gt);color:var(--gd)}.mseg button[data-mst="일시멈춤"][aria-pressed=true]{border-color:#e0a030;background:#fff4dc;color:#a36a00}.mseg button[data-mst="완료"][aria-pressed=true]{border-color:#5b6bd6;background:#e9ecfb;color:#3a47a8}
.utiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:14px 0}.ut{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--side);position:relative}.ut b{font-size:26px;font-weight:700;display:block;line-height:1.1}.ut small{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;margin-top:6px}.ut small i{width:8px;height:8px;border-radius:50%;background:var(--c)}.ut em{position:absolute;top:10px;right:10px;font-style:normal;font-size:10px;font-weight:700;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--ink2)}
.uwrap{overflow-x:auto}.ugrid{display:grid;grid-template-columns:64px minmax(110px,1fr) 172px 108px 108px 30px;gap:8px;align-items:center;min-width:640px}.ugrid.uh{font-size:12px;color:var(--ink2);font-weight:700;padding:8px 0;border-bottom:1px solid var(--line)}.ugrid.uh span{text-align:center}.ugrid.ur{padding:7px 0;border-bottom:1px solid var(--line)}.ugrid .in{padding:6px 7px;font-size:12px;border-radius:10px;min-width:0;background:var(--surf)}.ugrid input[type=date]{text-align:center}
.uadd{background:#f1f2f4;border:1px dashed #b9bec6;border-radius:12px;padding:8px 8px 10px;margin:8px 0 6px}.uadd .ugrid{padding:0;border:0;min-width:0}.ucap{font-size:11px;font-weight:800;color:#6b717b;letter-spacing:.02em;margin:0 0 6px 2px}
.tl3{display:flex;gap:3px;justify-content:center}.gd{width:18px;height:18px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;opacity:.25;flex:none;padding:0;transition:opacity .12s,transform .12s}.gd[aria-pressed=true]{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}.gd:hover{opacity:.7}.gd[aria-pressed=true]:hover{opacity:1}
.sc4{display:flex;gap:3px;justify-content:center}.sb{border:0;border-radius:11px;padding:4px 0;width:40px;font-size:11px;font-weight:700;background:var(--sbg);color:var(--c);opacity:.5;transition:opacity .12s}.sb[aria-pressed=true]{opacity:1;background:var(--c);color:#fff}.sb:hover{opacity:.85}
.ux{border:0;background:transparent;color:var(--ink2);font-size:18px;border-radius:8px;width:30px;height:30px}.ux:hover{background:#fde8e4;color:#b3402a}
.pgr{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px}.pgr button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surf);border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2)}.pgr button[aria-pressed=true]{background:var(--gd);color:#fff;border-color:var(--gd)}.pgr button:disabled{opacity:.35}
.dc{text-align:center;color:var(--ink2)}
.sch{margin-bottom:16px}.uhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.uhead small{color:var(--ink2)}
.jcard{margin-top:16px}.jcard .jform textarea{min-height:90px}
.top h1 .ib{width:34px;height:34px;font-size:18px;flex:none}
.mh{display:flex;justify-content:space-between;align-items:center}.ib.sm{width:28px;height:28px;font-size:15px;border-radius:9px;margin-left:6px}
.sg{display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr);gap:20px;margin-top:10px}
.mt{font-weight:700;font-size:13px;margin-bottom:8px}.mt small{color:var(--ink2);font-weight:500;margin-left:6px}
.mw,.mg{display:grid;grid-template-columns:repeat(7,1fr)}.mw b{font-size:11px;color:var(--ink2);text-align:center;padding:4px 0}
.mc{border:0;background:none;padding:2px 0;display:grid;place-items:center;position:relative;height:36px;font-size:12px}
.mc span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.mc:hover span{background:var(--gt)}.mc.o{color:#b4b9ae}.mc.t span{background:var(--gd);color:#fff;font-weight:700}
.mc i{position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--g)}
.sun{color:#dc2626}.sat{color:#2563eb}.mc.t.sun span,.mc.t.sat span{color:#fff}
.evl{max-height:300px;overflow:auto;min-width:0}
.ev2{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev2 .dt{width:40px;text-align:center;border-left:3px solid var(--g);padding-left:8px;flex:none}.ev2 .dt strong{display:block;font-size:17px;line-height:1.1}.ev2 .dt small{color:var(--ink2);font-size:11px}
.ev2 .tx{flex:1;min-width:0}.ev2 .tx b{display:block;font-size:13px;overflow-wrap:anywhere}.ev2 .tx small{color:var(--ink2);font-size:11px}
.lbl{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:8px}
.big{display:flex;align-items:baseline;gap:12px;margin:10px 0 12px}.big strong{font-size:34px;color:var(--gd)}.big span{color:var(--ink2);font-size:13px}
.pbar{width:110px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.pbar.wide{width:100%;height:10px;border-radius:10px;margin-bottom:12px}
.pbar i{display:block;height:100%;background:var(--gd);border-radius:inherit}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;border:0;padding:0;background:linear-gradient(to right,#9aa0a6 var(--v,0%),#e3e5e8 var(--v,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#9aa0a6;border:3px solid #fff;box-shadow:0 0 0 1px #b5b9be;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#9aa0a6;border:3px solid #fff;box-shadow:0 0 0 1px #b5b9be;cursor:pointer}
input[type=range]::-moz-range-track{background:transparent}
.board{display:flex;gap:14px;overflow-x:auto;margin-top:12px;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 270px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--side)}
.col.now2{background:var(--gt);border-color:var(--g)}
.col h3{font-size:14px}.col small{color:var(--ink2);font-size:11px}
.col ul{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.col li{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:10px;padding:8px 10px}
.tk{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--ink);font-size:13px}
.tk input{accent-color:var(--gd);width:16px;height:16px;flex:none}
.tk span{overflow-wrap:anywhere}.tk .dn{text-decoration:line-through;color:var(--ink2)}
.x{border:0;background:none;color:var(--ink2);font-size:18px;line-height:1}
.addr{display:flex;gap:6px}.addr .in{padding:8px 10px;font-size:13px}.addr .btn{padding:8px 12px}
@media(max-width:1100px){.sg{grid-template-columns:1fr}}
@media(max-width:820px){.dgrid{grid-template-columns:1fr}.col{flex-basis:240px}}
@media(max-width:520px){.plist{grid-template-columns:1fr}}
.big .st{padding:3px 12px;border-radius:12px;font-weight:700;font-size:12px;background:var(--gt);color:var(--gd)}
.big .st.late{background:#fde8e4;color:#b3402a}.big .st.wait{background:var(--line);color:var(--ink2)}
.kvs{margin-top:18px}.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.kv span{color:var(--ink2)}
.jform{display:grid;gap:8px;margin:12px 0 18px}.jform .btn{justify-self:end}.jform textarea{resize:vertical;font:inherit}
.jday h4{margin:16px 0 8px;font-size:13px;color:var(--gd)}
.jitem{display:flex;gap:8px;align-items:flex-start;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.jitem p{margin:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.pill.sm{font-size:13px;font-weight:600;margin-left:12px;vertical-align:middle}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}#login[hidden]{display:none}
.lcard{width:min(400px,100%);background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -20px rgba(20,40,10,.25)}
.lcard p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.lnk{border:0;background:none;color:var(--gd);font-weight:600;font-size:12px;padding:6px 0;text-align:left}
.create b svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile small{display:block;color:var(--ink2);font-size:11px;margin-bottom:2px}.tile strong{font-size:15px;overflow-wrap:anywhere}
.fab svg{display:block;margin:auto}
.lcard>*{align-self:stretch}.lcard>img{align-self:center}.lcard p{text-align:center}.lcard .lnk{text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.split .half{min-width:0}.split .half+.half{border-left:1px solid var(--line);padding-left:18px;margin-left:18px;display:flex;flex-direction:column}
.split .sg{grid-template-columns:1fr}.split .evl{max-height:240px}
.paper{flex:1;width:100%;min-height:320px;margin-top:10px;border:1px solid #e6e2c8;border-radius:12px;background-color:#fffef6;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#d8dbc6 31px,#d8dbc6 32px);background-attachment:local;line-height:32px;padding:0 14px;font:inherit;font-size:14px;line-height:32px;resize:vertical;color:var(--ink)}
.paper:focus{outline:1px solid #7a808a;outline-offset:0}
.msv{font-size:11px;color:var(--ink2)}
.x.ed{font-size:14px}
.jitem.edit{flex-direction:column;align-items:stretch}.jitem.edit .in{margin-bottom:6px}.jeb{display:flex;gap:6px;justify-content:flex-end}.btn.sm{padding:6px 14px;font-size:12px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surf)}
.prow .dot{width:10px;height:34px;border-radius:5px;flex:none}.prow .tx{flex:1;min-width:0}.prow b{display:block;font-size:13px;overflow-wrap:anywhere}.prow small{color:var(--ink2);font-size:11px}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:var(--gt);color:var(--gd);flex:none}
@media(max-width:1100px){.split{grid-template-columns:1fr}.split .half+.half{border-left:0;padding-left:0;margin-left:0;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}}
@media(max-width:820px){.ws .nm{max-width:120px}.top{flex-wrap:wrap}}
.fab{display:none}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:0}
 .side .logo,.side .cloud,.side .create{display:none}
 nav{flex-direction:row;flex:1;justify-content:space-around}
 nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;align-items:center}
 main{padding:14px 12px 100px;height:auto;overflow:visible}
 .top h1{font-size:20px}
 .mlogo{display:block!important}.top h1{display:none}.top .ws{margin-left:auto}.gname{width:140px}.who small{display:none}.who strong{max-width:84px}.seg button{padding:7px 10px}
 .cell{padding:4px}.cell em{min-width:20px;height:20px;font-size:11px}
 .ev{inset:28px 0 auto 0;grid-auto-rows:22px}
 .bar{font-size:10px;padding:0 6px;margin:0 1px}.bar small{display:none}
 .dow div{padding:8px 2px;text-align:center}
 .fab{display:block;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:52px;height:52px;border-radius:50%;border:0;background:var(--gd);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(79,125,12,.45)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const PAL=[["#b9d435","#2b2d2f"],["#8cc63f","#1d2a0a"],["#2e8b3d","#fff"],["#1f7a5a","#fff"],["#24512a","#fff"],["#2563eb","#fff"],["#9333ea","#fff"],["#f5a623","#2b2d2f"]];
const THEMES=[{n:"라임",g:"#7cb518",gd:"#4f7d0c",gt:"#eef6d8"},{n:"에메랄드",g:"#2e9e6b",gd:"#1f7a5a",gt:"#e0f3ea"},{n:"틸",g:"#14a8a0",gd:"#0d7f79",gt:"#dff3f1"},{n:"블루",g:"#3b82f6",gd:"#1d5fd1",gt:"#e3edfe"},{n:"인디고",g:"#6366f1",gd:"#4338ca",gt:"#e8e9fd"},{n:"퍼플",g:"#a855f7",gd:"#7e22ce",gt:"#f1e5fd"},{n:"핑크",g:"#ec4899",gd:"#be185d",gt:"#fce4f0"},{n:"오렌지",g:"#f97316",gd:"#c2570c",gt:"#fdeadb"}];
function applyTheme(){const t=THEMES[settings.theme||0]||THEMES[0],s=document.documentElement.style;s.setProperty("--g",t.g);s.setProperty("--gd",t.gd);s.setProperty("--gt",t.gt)}
function drawColors(){$("#pColors").innerHTML=PAL.map((c,i)=>`<button type="button" class="sw" data-pc="${i}" aria-pressed="${selColor===i}" aria-label="색상 ${i+1}" style="background:${c[0]}"></button>`).join("");$("#cHint").textContent=selColor==null?"(선택하지 않으면 무작위)":""}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)};
const dn=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>s.replace(/-/g,".");
let db=null,projects=[],settings={workspace:"",weekStart:0,theme:0},settingsLoaded=false,view="dashboard",editId=null,selColor=null;
let mon=new Date(),scope="month",layout="tl";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2800)}
function setCloud(s){const c=$("#cloud");c.className="cloud "+s;c.lastChild.textContent={on:"데이터베이스 연결됨",off:"연결 안 됨 · 저장되지 않음",connecting:"연결 중…"}[s]}
function userName(){let e="";try{const x=getSession();e=x&&x.email?x.email.split("@")[0]:""}catch(_){}return (settings.workspace||"").trim()||e}
const head=t=>`<div class="top"><div style="display:flex;align-items:center;gap:12px"><a href="#dashboard" data-home aria-label="대시보드로 이동" class="mlogo"><img style="height:30px;display:block" src="${$(".logo img").src}" alt="SID"></a><h1>${t}</h1></div><div class="ws">${settingsLoaded&&userName()?`<span class="nm" title="${esc(userName())}">${esc(userName())}</span>`:""}${window.__sb&&getSession()?'<button class="lo" data-logout>로그아웃</button>':""}</div></div>`;

const KN=["일","월","화","수","목","금","토"],dcls=k=>k===0?"sun":k===6?"sat":"";
const ws0=()=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()-(mon.getDay()-settings.weekStart+7)%7);
function ctl(){
 const Y=mon.getFullYear(),M=mon.getMonth()+1;let t;
 if(scope==="month")t=`${Y}년 ${M}월`;
 else if(scope==="week"){const a=ws0(),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);t=`${a.getFullYear()}년 ${a.getMonth()+1}월 ${a.getDate()}일 – ${b.getMonth()+1}월 ${b.getDate()}일`}

/* cloud */
const SB_KEY="pms_supabase";
const sbCfg=()=>{const b=window.SUPABASE_CONFIG;if(b&&b.url&&b.key)return{url:String(b.url).replace(/\/+$/,""),key:b.key,builtin:true};try{const c=JSON.parse(localStorage.getItem(SB_KEY)||"null");return c&&c.url&&c.key?{url:c.url.replace(/\/+$/,""),key:c.key}:null}catch(x){return null}};
function makeSupabase(cfg){
 const hdr=async()=>{const t=await freshToken(cfg);if(!t){logout();throw new Error("로그인이 필요합니다.")}return{apikey:cfg.key,Authorization:"Bearer "+t,"Content-Type":"application/json"}},T=cfg.url+"/rest/v1/pms_docs";
 const watchers={},err=async r=>{if(r.status===401){logout();throw new Error("세션이 만료되었습니다.")}if(!r.ok){let m="";try{m=(await r.json()).message}catch(x){}throw Object.assign(new Error(m||r.statusText),{code:r.status})}};
 const refresh=col=>(watchers[col]||[]).forEach(w=>w.run());
 function watch(col,cb,fail,single){
  let last=null,dead=false;
  const w={run:async()=>{if(dead)return;try{const r=await fetch(`${T}?col=eq.${encodeURIComponent(col)}&select=id,data`,{headers:await hdr()});await err(r);const rows=await r.json(),sig=JSON.stringify(rows);if(sig===last)return;last=sig;
    if(single){const row=rows.find(x=>x.id===single);cb({exists:!!row,data:()=>row?row.data:undefined})}else cb({docs:rows.map(x=>({id:x.id,data:()=>x.data}))})}catch(e){fail&&fail(e)}}};
  (watchers[col]=watchers[col]||[]).push(w);w.run();w.t=setInterval(w.run,4000);
  return()=>{dead=true;clearInterval(w.t)};
 }
 const docRef=(col,id)=>({onSnapshot:(cb,fail)=>watch(col,cb,fail,id),
  set:async d=>{const r=await fetch(`${T}?on_conflict=col,id`,{method:"POST",headers:{...await hdr(),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({col,id,data:d,updated_at:new Date().toISOString()})});await err(r);refresh(col)},
  delete:async()=>{const r=await fetch(`${T}?col=eq.${encodeURIComponent(col)}&id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:await hdr()});await err(r);refresh(col)}});
 return{collection:col=>({onSnapshot:(cb,fail)=>watch(col,cb,fail),doc:id=>docRef(col,id||crypto.randomUUID())}),doc:path=>{const[c,i]=path.split("/");return docRef(c,i)}};
}
const SS="pms_session",getSession=()=>{try{return JSON.parse(localStorage.getItem(SS)||"null")}catch(x){return null}};
const clearSession=()=>{try{localStorage.removeItem(SS)}catch(x){}};
function setSession(r){const s={access_token:r.access_token,refresh_token:r.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+r.expires_in||3600),email:(r.user&&r.user.email)||""};localStorage.setItem(SS,JSON.stringify(s));return s}
async function authCall(cfg,path,body){
 const r=await fetch(cfg.url+"/auth/v1/"+path,{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
 let j={};try{j=await r.json()}catch(x){}
 if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||j.message||"요청에 실패했습니다."),{status:r.status});
 return j;
}
async function freshToken(cfg){
 const s=getSession();if(!s)return null;
 if(s.expires_at-60>Date.now()/1000)return s.access_token;
 try{const r=await authCall(cfg,"token?grant_type=refresh_token",{refresh_token:s.refresh_token});return setSession(r).access_token}
 catch(e){if(e.status>=400&&e.status<500){clearSession();return null}return s.access_token}
}
async function logout(){const c=sbCfg(),s=getSession();clearSession();if(c&&s){try{await fetch(c.url+"/auth/v1/logout",{method:"POST",headers:{apikey:c.key,Authorization:"Bearer "+s.access_token}})}catch(x){}}location.reload()}
function showLogin(cfg){
 let mode="in";const L=$("#login");L.hidden=false;
 const draw=(msg,ok)=>{
  L.innerHTML=`<form class="lcard" id="lform" novalidate><img src="${$(".logo img").src}" alt="SID" style="height:44px;align-self:center"><p>프로젝트 관리 시스템에 접속하려면 로그인이 필요합니다.</p>
  ${cfg?"":`<label>Supabase Project URL<input class="in" id="lUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></label><label>anon public key<input class="in" id="lKey" type="password" autocomplete="off"></label>`}
  <label>이메일<input class="in" id="lMail" type="email" autocomplete="username" required></label>
  <label>비밀번호<input class="in" id="lPw" type="password" autocomplete="${mode==="in"?"current-password":"new-password"}" minlength="6" required></label>
  <div class="err" id="lErr" role="alert" style="${ok?"color:var(--gd)":""}">${msg||""}</div>
  <button class="btn" id="lGo" type="submit">${mode==="in"?"로그인":"가입하기"}</button>
  <button class="lnk" id="lSw" type="button">${mode==="in"?"계정이 없으신가요? 회원가입":"이미 계정이 있습니다. 로그인"}</button></form>`;
  $("#lSw").onclick=()=>{mode=mode==="in"?"up":"in";draw()};
  $("#lform").onsubmit=async e=>{
   e.preventDefault();const em=$("#lMail").value.trim(),pw=$("#lPw").value,er=$("#lErr");
   let c=cfg;if(!c){const u=$("#lUrl").value.trim(),k=$("#lKey").value.trim();if(!/^https:\/\/.+/.test(u)||!k){er.textContent="Project URL(https://...)과 anon key를 입력해 주세요.";return}c={url:u.replace(/\/+$/,""),key:k}}
   if(!em||pw.length<6){er.textContent="이메일과 6자 이상의 비밀번호를 입력해 주세요.";return}
   $("#lGo").disabled=true;er.textContent="";
   try{
    if(mode==="up"){const r=await authCall(c,"signup",{email:em,password:pw});if(!r.access_token){mode="in";draw("가입 요청이 완료되었습니다. 이메일 확인이 필요하면 메일의 링크를 누른 뒤 로그인해 주세요.",true);return}setSession(r)}
    else setSession(await authCall(c,"token?grant_type=password",{email:em,password:pw}));
    if(!cfg)localStorage.setItem(SB_KEY,JSON.stringify(c));
    location.reload();
   }catch(x){$("#lGo").disabled=false;er.textContent=x.status===400&&mode==="in"?"이메일 또는 비밀번호가 올바르지 않거나, 이메일 확인이 완료되지 않았습니다.":x.message}
  };
 };
 draw();
}
async function startCloud(){
 const cfg=sbCfg();
 if(cfg){db=makeSupabase(cfg);window.__sb=true}
 else{try{db=window.claude?await window.claude.use("db"):null}catch(x){db=null}}
 if(!db){setCloud("off");settingsLoaded=true;if(view!=="settings")render();return}
 const fail=e=>{setCloud("off");if(!settingsLoaded){settingsLoaded=true;if(view!=="settings")render()}if(window.__sb)toast("데이터베이스 연결 오류: "+(e&&e.message||"확인 필요"))};
 db.collection("projects").onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));setCloud("on");if(!$("#dlg").open&&view!=="settings"&&!(detailId&&document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)))render()},fail);
 db.collection("plans").onSnapshot(s=>{plans=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="plan"&&!$("#dlgP").open&&!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))render()},fail);
 db.doc("settings/main").onSnapshot(s=>{if(s.exists){settings={...settings,...s.data()};applyTheme()}settingsLoaded=true;if(view!=="settings")render()},fail);
}
(async()=>{
 const cfg=sbCfg();
 if(cfg){if(await freshToken(cfg))startCloud();else showLogin(cfg)}
 else if(window.claude)startCloud();
 else showLogin(null);
})();
route();
</script>
