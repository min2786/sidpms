<style>

<script>
const PAL=[["#b9d435","#2b2d2f"],["#8cc63f","#1d2a0a"],["#2e8b3d","#fff"],["#1f7a5a","#fff"],["#24512a","#fff"],["#2563eb","#fff"],["#9333ea","#fff"],["#f5a623","#2b2d2f"],["#e5484d","#fff"],["#f97316","#fff"],["#facc15","#2b2d2f"],["#ec4899","#fff"],["#be123c","#fff"],["#14a8a0","#fff"],["#06b6d4","#fff"],["#38bdf8","#2b2d2f"],["#1e3a8a","#fff"],["#6366f1","#fff"],["#92603a","#fff"],["#64748b","#fff"]];
const THEMES=[{n:"라임",g:"#7cb518",gd:"#4f7d0c",gt:"#eef6d8"},{n:"에메랄드",g:"#2e9e6b",gd:"#1f7a5a",gt:"#e0f3ea"},{n:"틸",g:"#14a8a0",gd:"#0d7f79",gt:"#dff3f1"},{n:"블루",g:"#3b82f6",gd:"#1d5fd1",gt:"#e3edfe"},{n:"인디고",g:"#6366f1",gd:"#4338ca",gt:"#e8e9fd"},{n:"퍼플",g:"#a855f7",gd:"#7e22ce",gt:"#f1e5fd"},{n:"핑크",g:"#ec4899",gd:"#be185d",gt:"#fce4f0"},{n:"오렌지",g:"#f97316",gd:"#c2570c",gt:"#fdeadb"}];
function applyTheme(){const t=THEMES[settings.theme||0]||THEMES[0],s=document.documentElement.style;s.setProperty("--g",t.g);s.setProperty("--gd",t.gd);s.setProperty("--gt",t.gt);s.setProperty("--tg",t.g)}
function drawColors(){$("#pColors").innerHTML=PAL.map((c,i)=>`<button type="button" class="sw" data-pc="${i}" aria-pressed="${selColor===i}" aria-label="색상 ${i+1}" style="background:${c[0]}"></button>`).join("");$("#cHint").textContent=selColor==null?"(선택하지 않으면 무작위)":""}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return Math.floor(Date.UTC(a,b-1,c)/864e5)};
const dn=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>s.replace(/-/g,".");
let db=null,projects=[],settings={workspace:"",weekStart:0,theme:0},settingsLoaded=false,view="dashboard",editId=null,selColor=null;
let mon=new Date(),scope="month",layout="tl";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2800)}
function setCloud(s){const c=$("#cloud");c.className="cloud "+s;c.lastChild.textContent={on:"데이터베이스 연결됨",off:"연결 안 됨 · 저장되지 않음",connecting:"연결 중…"}[s]}
function userName(){let e="";try{const x=getSession();e=x&&x.email?x.email.split("@")[0]:""}catch(_){}return (settings.workspace||"").trim()||e}
const head=t=>`<div class="top"><div style="display:flex;align-items:center;gap:12px"><a href="#dashboard" data-home aria-label="대시보드로 이동" class="mlogo"><img style="height:30px;display:block" src="${$(".logo img").src}" alt="SID"></a><h1>${t}</h1></div><div class="ws">${settingsLoaded&&userName()?`<a class="nm" href="#settings" title="설정으로 이동" aria-label="설정으로 이동">${esc(userName())}</a>`:""}${window.__sb&&getSession()?'<button class="lo" data-logout>로그아웃</button>':""}</div></div>`;

const KN=["일","월","화","수","목","금","토"],dcls=k=>k===0?"sun":k===6?"sat":"";
const ws0=()=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()-(mon.getDay()-settings.weekStart+7)%7);
function ctl(){
 const Y=mon.getFullYear(),M=mon.getMonth()+1;let t;
 const yr=y=>`<span class="yl">${y}</span><span class="ys">${String(y).slice(2)}</span>`;
 if(scope==="month")t=`${yr(Y)}년 ${M}월`;
 else if(scope==="week"){const a=ws0(),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);t=`${yr(a.getFullYear())}년 ${a.getMonth()+1}월 ${a.getDate()}일 – ${b.getMonth()+1}월 ${b.getDate()}일`}
 else t=`${yr(Y)}년 ${M}월 ${mon.getDate()}일 (${KN[mon.getDay()]})`;
 const seg=(a,items,cur)=>`<div class="seg">${items.map(([v,l])=>`<button data-${a}="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`;
 return `<div class="ctl"><div class="cnav"><h2>${t}</h2><button class="ib" data-m="-1" aria-label="이전">‹</button><button class="ib" data-m="1" aria-label="다음">›</button><button class="pill" data-m="0">오늘</button></div><span class="csp" style="flex:1"></span>${seg("ly",[["tl","타임라인"],["grid","캘린더"]],layout)}${seg("sc",[["month","월간"],["week","주간"],["day","일간"]],scope)}</div>`;
}
function calendar(){
 const ws=settings.weekStart,today=dn(new Date()),cols=scope==="day"?1:7,y=mon.getFullYear(),m=mon.getMonth(),bases=[];
 if(scope==="month"){const off=(new Date(y,m,1).getDay()-ws+7)%7,n=Math.ceil((off+new Date(y,m+1,0).getDate())/7);for(let w=0;w<n;w++)bases.push(new Date(y,m,1-off+w*7))}
 else bases.push(scope==="week"?ws0():new Date(y,m,mon.getDate()));
 const P=projects.filter(p=>p.start&&(p.end||isO(p))).map(p=>({...p,s:pd(p.start),e:isO(p)?pd(p.start)+36500:pd(p.end)})).sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
 let h=`<div class="cal" style="--cols:${cols}"><div class="dow">${Array.from({length:cols},(_,i)=>{const k=cols===1?mon.getDay():(i+ws)%7;return `<div class="${dcls(k)}">${KN[k]}</div>`}).join("")}</div><div class="weeks">`;
 bases.forEach(b0=>{
  const base=dn(b0),lanes=[],bars=[];

async function sendKakao(btn){

 else if(btn.dataset.kp){const x=plans.find(z=>z.id===btn.dataset.kp);if(!x)return;const d=pdays(x),r=x.start===x.end?fmt(x.start).slice(2):`${fmt(x.start).slice(2)} ~ ${fmt(x.end).slice(2)}`;msg=`[${PK[x.kind]||"휴가"}]\n${x.type}${x.title&&x.title!==x.type?" · "+x.title:""}\n${r} (${fmtD(d)}일)${x.note?"\n"+x.note:""}`}
 else if(btn.dataset.kv){const v=(p.versions||[]).find(x=>x.id===btn.dataset.kv);if(!v)return;msg=`[${p.name}]\n${v.ver} (${fmt(v.day).slice(2)})${v.t?"\n"+v.t:""}`}
 else{const day=btn.dataset.kk,L=(p.journal||[]).filter(x=>x.day===day).sort((a,b)=>a.at-b.at);if(!L.length)return;msg=`[${p.name}]\n`+L.map(x=>x.t).join("\n")}

 try{await mcp.callTool("PlayMCP","KakaotalkChat-MemoChat",{message:msg},{cache:false});toast("카카오톡으로 전송했습니다")}
 catch(x){const c=x&&x.code;toast(c==="needs_reauth"||c==="server_not_connected"||c==="server_not_found"?"claude.ai 설정 > 커넥터에서 PlayMCP(카카오톡)를 연결해 주세요.":c==="not_in_manifest"||c==="approval_required"||c==="consent_required"?"카카오톡 연결 허용이 필요합니다.":"카카오톡 전송에 실패했습니다. ("+(c||"unknown")+")")}
 btn.disabled=false;

 const mF=dn(new Date(Y,M,1)),mL=dn(new Date(Y,M+1,0)),inM=items.filter(x=>pd(x.end)>=mF&&pd(x.start)<=mL),up=items.find(x=>pd(x.end)>=today);
 const upT=up?`${esc(up.title)} · ${fmt(up.start)}`:"없음";
 const dim=new Date(Y,M+1,0).getDate(),remD=mF>today?dim:mL<today?0:mL-today+1,pctB=Math.round(remD/dim*100),rng=Math.round(EV_KM*remD/dim);

 const tiles=k==="work"?[[null,carT],["이번 달 일정",`${inM.length}건`],["다가오는 일정",upT]]:[[`${Y}년 사용 연차`,fmtD(items.filter(x=>x.start.slice(0,4)===String(Y)&&(x.type==="연차"||x.type==="반차")).reduce((a,x)=>a+pdays(x),0))+"일"],["이번 달 휴가",fmtD(inM.reduce((a,x)=>a+pdays(x),0))+"일"],["다가오는 휴가",upT]];

 let g=`<div class="cal" style="--cols:7"><div class="dow">${Array.from({length:7},(_,i)=>{const d=(i+ws)%7;return `<div class="${dcls(d)}">${KN[d]}</div>`}).join("")}</div><div class="weeks">`;
 for(let w=0;w<n;w++){
  const base=dn(new Date(Y,M,1-off+w*7)),lanes=[],bars=[];
  items.forEach(x=>{const s0=pd(x.start),e0=pd(x.end);if(e0<base||s0>base+6)return;const a=Math.max(s0,base)-base,b=Math.min(e0,base+6)-base;let l=lanes.findIndex(z=>z<a);if(l<0){l=lanes.length;lanes.push(-1)}lanes[l]=b;
   const c=pcol(x),L=s0>=base?20:0,R=e0<=base+6?20:0;
   bars.push(`<button class="bar" data-pid="${esc(x.id)}" title="${esc(x.title)} (${fmt(x.start)} – ${fmt(x.end)})" style="grid-column:${a+1}/${b+2};grid-row:${l+1};background:${c[0]};color:${c[1]};border-radius:${L}px ${R}px ${R}px ${L}px">${esc(x.title)}</button>`)});
  let cells="";for(let c=0;c<7;c++){const d=new Date(Y,M,1-off+w*7+c);cells+=`<div class="cell ${d.getMonth()!==M?"o":""} ${dn(d)===today?"t":""} ${dcls(d.getDay())}" data-d="${iso(d)}"><em>${d.getDate()===1?(d.getMonth()+1)+"월 1일":d.getDate()}</em></div>`}
  g+=`<div class="wk" style="min-height:${Math.max(96,42+lanes.length*30)}px">${cells}<div class="ev">${bars.join("")}</div></div>`;
 }
 g+="</div></div>";
 const rows=inM.length?inM.map(x=>{const c=pcol(x),dd=pdays(x);return `<div class="prow"><span class="dot" style="background:${c[0]}"></span><div class="tx"><b>${esc(x.title)}</b><small>${fmt(x.start)}${x.start!==x.end?" – "+fmt(x.end):""} · ${k==="vacation"?fmtD(dd)+"일":dd+"일"}${x.note?" · "+esc(x.note):""}</small></div><span class="tag">${esc(x.type)}</span>${k==="vacation"?`<button class="kk kp" data-kp="${esc(x.id)}" title="카카오톡 나에게 보내기">카톡 전송</button>`:""}<button class="x ed" data-pedit="${esc(x.id)}" aria-label="수정" title="수정">✎</button><button class="x" data-pdel="${esc(x.id)}" aria-label="삭제" title="삭제">×</button></div>`}).join(""):`<div class="empty">이 달에 등록된 일정이 없습니다. 날짜를 누르거나 “일정 추가”를 눌러 등록하세요.</div>`;

 <div class="tiles">${tiles.map(([a,b])=>a===null?b:`<div class="tile"><small>${a}</small><strong>${b}</strong></div>`).join("")}</div>${g}

const sbCfg=()=>{const b=window.SUPABASE_CONFIG;if(b&&b.url&&b.key)return{url:String(b.url).replace(/\/+$/,""),key:b.key,builtin:true};try{const c=JSON.parse(localStorage.getItem(SB_KEY)||"null");return c&&c.url&&c.key?{url:c.url.replace(/\/+$/,""),key:c.key}:null}catch(x){return null}};
function makeSupabase(cfg){
 const hdr=async()=>{const t=await freshToken(cfg);if(!t){logout();throw new Error("로그인이 필요합니다.")}return{apikey:cfg.key,Authorization:"Bearer "+t,"Content-Type":"application/json"}},T=cfg.url+"/rest/v1/pms_docs";
 const watchers={},err=async r=>{if(r.status===401){logout();throw new Error("세션이 만료되었습니다.")}if(!r.ok){let m="";try{m=(await r.json()).message}catch(x){}throw Object.assign(new Error(m||r.statusText),{code:r.status})}};
 const refresh=col=>(watchers[col]||[]).forEach(w=>w.run());
 function watch(col,cb,fail,single){
  let last=null,dead=false;
  const w={run:async()=>{if(dead)return;try{const r=await fetch(`${T}?col=eq.${encodeURIComponent(col)}&select=id,data`,{headers:await hdr()});await err(r);const rows=await r.json(),sig=JSON.stringify(rows);if(sig===last)return;last=sig;
    if(single){const row=rows.find(x=>x.id===single);cb({exists:!!row,data:()=>row?row.data:undefined})}else cb({docs:rows.map(x=>({id:x.id,data:()=>x.data}))})}catch(e){fail&&fail(e)}}};
  (watchers[col]=watchers[col]||[]).push(w);w.run();w.t=setInterval(w.run,4000);
  return()=>{dead=true;clearInterval(w.t)};
 }
 const docRef=(col,id)=>({onSnapshot:(cb,fail)=>watch(col,cb,fail,id),
  set:async d=>{const r=await fetch(`${T}?on_conflict=col,id`,{method:"POST",headers:{...await hdr(),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({col,id,data:d,updated_at:new Date().toISOString()})});await err(r);refresh(col)},
  delete:async()=>{const r=await fetch(`${T}?col=eq.${encodeURIComponent(col)}&id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:await hdr()});await err(r);refresh(col)}});
 const B="pms-images",S=cfg.url+"/storage/v1",sh=async()=>{const t=await freshToken(cfg);if(!t){logout();throw new Error("로그인이 필요합니다.")}return{apikey:cfg.key,Authorization:"Bearer "+t}};
 const storage={
  async upload(path,blob,bk=B){const r=await fetch(`${S}/object/${bk}/${path}`,{method:"POST",headers:{...await sh(),"Content-Type":blob.type||"image/jpeg","x-upsert":"true"},body:blob});if(!r.ok){let m="";try{m=(await r.json()).message}catch(x){}throw new Error(m||"업로드 실패("+r.status+") — Storage 설정(supabase.sql)을 확인하세요")}},
  async urls(paths){const r=await fetch(`${S}/object/sign/${B}`,{method:"POST",headers:{...await sh(),"Content-Type":"application/json"},body:JSON.stringify({expiresIn:86400,paths})});if(!r.ok)throw new Error("이미지 주소를 가져오지 못했습니다("+r.status+")");const a=await r.json();return a.filter(x=>x.signedURL&&!x.error).map(x=>({path:x.path,url:S+x.signedURL}))},
  async remove(paths,bk=B){await fetch(`${S}/object/${bk}`,{method:"DELETE",headers:{...await sh(),"Content-Type":"application/json"},body:JSON.stringify({prefixes:paths})})}
 };
 const rpc=async(name,args)=>{const r=await fetch(`${cfg.url}/rest/v1/rpc/${name}`,{method:"POST",headers:await hdr(),body:JSON.stringify(args||{})});if(!r.ok){let m={};try{m=await r.json()}catch(x){}const e=new Error(m.message||m.hint||("RPC "+r.status));e.status=r.status;e.code=m.code;throw e}const t=await r.text();if(!t)return null;try{return JSON.parse(t)}catch(x){return null}};
 const fn=async(name,body)=>{const r=await fetch(`${cfg.url}/functions/v1/${name}`,{method:"POST",headers:await hdr(),body:JSON.stringify(body)});if(!r.ok){let m="";try{m=(await r.json()).error}catch(x){}throw new Error(m||"서버 함수 호출 실패("+r.status+") — Edge Function 배포를 확인하세요")}return r.json()};
 return{storage,fn,rpc,collection:col=>({onSnapshot:(cb,fail)=>watch(col,cb,fail),doc:id=>docRef(col,id||crypto.randomUUID())}),doc:path=>{const[c,i]=path.split("/");return docRef(c,i)}};
}
const SS="pms_session",getSession=()=>{try{return JSON.parse(localStorage.getItem(SS)||"null")}catch(x){return null}};
const clearSession=()=>{try{localStorage.removeItem(SS)}catch(x){}};
function setSession(r){const s={access_token:r.access_token,refresh_token:r.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+r.expires_in||3600),email:(r.user&&r.user.email)||""};localStorage.setItem(SS,JSON.stringify(s));return s}
async function authCall(cfg,path,body){
 const r=await fetch(cfg.url+"/auth/v1/"+path,{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
 let j={};try{j=await r.json()}catch(x){}
 if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||j.message||"요청에 실패했습니다."),{status:r.status});
 return j;
}
async function freshToken(cfg){
 const s=getSession();if(!s)return null;
 if(s.expires_at-60>Date.now()/1000)return s.access_token;
 try{const r=await authCall(cfg,"token?grant_type=refresh_token",{refresh_token:s.refresh_token});return setSession(r).access_token}
 catch(e){if(e.status>=400&&e.status<500){clearSession();return null}return s.access_token}
}

 db.collection("plans").onSnapshot(s=>{plans=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="plan"&&!$("#dlgP").open&&!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))render()},fail);
 db.doc("settings/main").onSnapshot(s=>{if(s.exists){settings={...settings,...s.data()};applyTheme()}settingsLoaded=true;if(view!=="settings")render()},fail);
}
(async()=>{
 const cfg=sbCfg();
 let oerr="";
 if(cfg&&/access_token=|error_description=/.test(location.hash)){
  const q=new URLSearchParams(location.hash.replace(/^#/,""));
  if(q.get("access_token")){setSession({access_token:q.get("access_token"),refresh_token:q.get("refresh_token"),expires_in:q.get("expires_in")});
   const t=q.get("access_token");fetch(cfg.url+"/auth/v1/user",{headers:{apikey:cfg.key,Authorization:"Bearer "+t}}).then(r=>r.json()).then(u=>{const s=getSession();if(s&&u&&u.email){s.email=u.email;localStorage.setItem(SS,JSON.stringify(s))}}).catch(()=>{})}
  else oerr=q.get("error_description")||"소셜 로그인에 실패했습니다.";
  history.replaceState(null,"",location.pathname+location.search+"#dashboard");
 }
 if(cfg){if(await freshToken(cfg))startCloud();else{showLogin(cfg);if(oerr)$("#lErr").textContent=oerr.replace(/\+/g," ")}}
 else if(window.claude)startCloud();
 else showLogin(null);
})();
route();

// ===== 웹푸시 알림 =====
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const devId=()=>{try{let v=localStorage.getItem("pms_dev");if(!v){v=Math.random().toString(36).slice(2,12);localStorage.setItem("pms_dev",v)}return v}catch(_){return"x"}};
const PF=[["daily","매일 오전 9시 요약"],["np","새 프로젝트"],["up","새 업데이트·컨텐츠 (긴급 포함)"],["vr","새 버전업"],["ev","새 일정"],["st","상태 변경"]];
const getPrefs=()=>{try{return JSON.parse(localStorage.getItem("pms_pf")||"{}")}catch(_){return{}}};
const pushOK=()=>"serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
async function pushReg(){return navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready)}
async function pushId(ep){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ep));return [...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function pushInit(){
 const box=$("#pushBox");if(!box)return;
 const put=(msg,btn)=>{if(!$("#pushBox"))return;$("#pushBox").innerHTML=`<div class="lbl">알림</div><small style="color:var(--ink2);display:block;margin:4px 0 10px;line-height:1.5">매일 오전 9시에 오늘 일정과 마감 임박(D-3) 프로젝트를 푸시로 알려드립니다.</small>${msg?`<div style="font-size:13px;margin-bottom:10px;line-height:1.5">${msg}</div>`:""}${btn||""}`};
 if(!window.PUSH_PUBLIC_KEY)return put("알림 키가 아직 설정되지 않았습니다. (config.js의 PUSH_PUBLIC_KEY)");
 if(!pushOK()){return put(isIOS()&&!standalone()?"아이폰은 Safari 공유 버튼 → <b>홈 화면에 추가</b> 후, 홈 화면의 SID 앱에서 이 설정을 열어 주세요.":"이 브라우저는 웹푸시를 지원하지 않습니다.")}
 let sub=null;try{const r=await pushReg();sub=await r.pushManager.getSubscription()}catch(_){}
 if(Notification.permission==="denied")return put("알림이 차단되어 있습니다. 브라우저/기기 설정에서 이 사이트의 알림을 허용해 주세요.");
 if(sub){const pf=getPrefs();put("✅ 이 기기에서 알림을 받는 중입니다. (내가 올린 변경은 내 기기로 오지 않습니다)",`<div id="pfBox" style="display:grid;gap:8px;margin:0 0 12px">${PF.map(([k,l])=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600"><input type="checkbox" data-pf="${k}" ${pf[k]===false?"":"checked"} style="width:18px;height:18px;accent-color:var(--tg,#7cb518)">${l}</label>`).join("")}</div><div style="display:flex;gap:8px"><button class="btn sec" id="pushTest">테스트 알림</button><button class="btn sec" id="pushOff">알림 끄기</button></div>`)}
 else put("",'<button class="btn" id="pushOn">이 기기에서 알림 받기</button>');
}
async function pushOn(){
 try{
  const perm=await Notification.requestPermission();if(perm!=="granted"){toast("알림 권한이 허용되지 않았습니다");return pushInit()}
  const r=await pushReg();let sub=await r.pushManager.getSubscription();
  if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(window.PUSH_PUBLIC_KEY)});
  const j=sub.toJSON();
  if(db)await db.collection("push").doc(await pushId(j.endpoint)).set({sub:j,dev:devId(),prefs:getPrefs(),ua:navigator.userAgent.slice(0,120),at:Date.now()});
  toast("알림이 켜졌습니다")
 }catch(e){toast("알림을 켜지 못했습니다: "+(e&&e.message||e))}
 pushInit()
}
async function pushPrefs(){
 const pf={};document.querySelectorAll("[data-pf]").forEach(c=>pf[c.dataset.pf]=c.checked);
 try{localStorage.setItem("pms_pf",JSON.stringify(pf));const r=await pushReg(),sub=await r.pushManager.getSubscription();if(sub&&db){const j=sub.toJSON();await db.collection("push").doc(await pushId(j.endpoint)).set({sub:j,dev:devId(),prefs:pf,ua:navigator.userAgent.slice(0,120),at:Date.now()})}toast("알림 설정이 저장되었습니다")}catch(e){toast("저장하지 못했습니다")}
}
document.addEventListener("change",e=>{if(e.target.matches("[data-pf]"))pushPrefs()});
async function pushOff(){
 try{const r=await pushReg(),sub=await r.pushManager.getSubscription();if(sub){const ep=sub.endpoint;await sub.unsubscribe();if(db)await db.collection("push").doc(await pushId(ep)).delete()}toast("알림이 꺼졌습니다")}catch(e){toast("알림을 끄지 못했습니다")}
 pushInit()
}
async function pushTest(){try{const r=await pushReg();await r.showNotification("SID 테스트 알림",{body:"이 기기에서 알림이 정상 표시됩니다.",icon:"icon-192.png"})}catch(e){toast("테스트 실패: "+(e&&e.message||e))}}
document.addEventListener("click",e=>{const t=e.target.closest("#pushOn,#pushOff,#pushTest");if(!t)return;t.id==="pushOn"?pushOn():t.id==="pushOff"?pushOff():pushTest()});
if(window.PUSH_PUBLIC_KEY&&"serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
